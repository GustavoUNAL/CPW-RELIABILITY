# Nginx — opsai.reliability.space + acceso por IP del VPS
#
# Instalar:
#   sudo cp deploy/nginx-opsai.reliability.space.conf /etc/nginx/sites-available/opsai.reliability.space
#   sudo ln -sf /etc/nginx/sites-available/opsai.reliability.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Mientras DNS no exista, usa: http://51.222.24.228/
# Cuando dig +short opsai.reliability.space = 51.222.24.228:
#   sudo certbot --nginx -d opsai.reliability.space

server {
    listen 80;
    listen [::]:80;
    # IP: acceso inmediato | dominio: cuando el DNS A esté publicado
    server_name 51.222.24.228 opsai.reliability.space;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    client_max_body_size 20m;
}
