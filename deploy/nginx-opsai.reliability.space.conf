# Nginx — reliability.opsai.space + opsai.space → PM2 (127.0.0.1:4173)
#
# Dominio comprado: opsai.space
# URL deseada con "reliability": https://reliability.opsai.space/
#
# DNS en el panel de opsai.space:
#   A   @            → 51.222.24.228
#   A   reliability  → 51.222.24.228
#   A   www          → 51.222.24.228   (opcional)
#
# Instalar:
#   sudo cp deploy/nginx-opsai.reliability.space.conf /etc/nginx/sites-available/opsai.space
#   sudo ln -sf /etc/nginx/sites-available/opsai.space /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/opsai.reliability.space
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d reliability.opsai.space -d opsai.space -d www.opsai.space

server {
    listen 80;
    listen [::]:80;
    server_name reliability.opsai.space opsai.space www.opsai.space 51.222.24.228;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    client_max_body_size 20m;
}
