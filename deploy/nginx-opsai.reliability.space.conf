# Nginx — opsai.reliability.space → PM2 (vite preview en 127.0.0.1:4173)
#
# Instalar:
#   sudo cp deploy/nginx-opsai.reliability.space.conf /etc/nginx/sites-available/opsai.reliability.space
#   sudo ln -sf /etc/nginx/sites-available/opsai.reliability.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d opsai.reliability.space
#
# DNS: registro A opsai.reliability.space → IP del VPS

server {
    listen 80;
    listen [::]:80;
    server_name opsai.reliability.space;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    client_max_body_size 20m;
}
